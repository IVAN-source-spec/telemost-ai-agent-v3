services:
  telemost-bot-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemost-bot-1
    restart: unless-stopped
    env_file:
    - .env
    environment:
      PULSE_SERVER: unix:/run/user/1001/pulse/native
      PULSE_SINK: virtual_sink_bot_1
      PULSE_SOURCE: virtual_sink_bot_1.monitor
      TELEMOST_AUDIO_SOURCE_NAME: virtual_sink_bot_1.monitor
      TELEMOST_AUTH_STATE_PATH: data/auth/yandex-session.json
      TELEMOST_AUTH_COOKIES_PATH: data/auth/cookies.json
      TELEMOST_BOT_POOL_SIZE: '1'
      BOT_NODE_ID: telemost-vm-1-bot-1
      BOT_NODE_NAME: VM1 Bot 1
      VOICE_COMMANDS_SERVICE_URL: ws://192.168.101.68:8020/ws/audio
      SESSION_UPDATE_ENABLED: '1'
      SESSION_UPDATE_TARGET_ID: telemost-vm-1-bot-1
      SESSION_UPDATE_API_TOKEN: ${SESSION_UPDATE_API_TOKEN}
      SESSION_UPDATE_ENCRYPTION_KEY: ${SESSION_UPDATE_ENCRYPTION_KEY}
      SESSION_UPDATE_MAX_PLAINTEXT_BYTES: '2097152'
    command:
    - sh
    - -lc
    - "/app/scripts/ensure_audio_sink.sh; rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp & for n in $(seq 1 40); do\n  [ -S /tmp/.X11-unix/X99 ] && break;\n  sleep 0.25;\ndone; export DISPLAY=:99; exec python api_run.py\n"
    ports:
    - 8001:8000
    volumes:
    - ./data/auth:/app/data/auth
    - ./recordings/bot-1:/app/recordings
    - ./yandex_disk_upload_errors_bot_1.jsonl:/app/yandex_disk_upload_errors.jsonl
    - /run/user/1001/pulse/native:/run/user/1001/pulse/native
    - /home/razumadmin/.config/pulse/cookie:/root/.config/pulse/cookie:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    shm_size: 2gb
